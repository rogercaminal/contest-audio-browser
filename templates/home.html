<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select Contest</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --text: #182132;
        --muted: #667085;
        --line: #d9e2ef;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --accent: #10b981;
        --shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.16), transparent 32rem),
          linear-gradient(135deg, #eef4ff 0%, #f8fafc 44%, #eefdf8 100%);
      }

      .shell {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 42px 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), #06b6d4);
        box-shadow: 0 10px 26px rgba(37, 99, 235, 0.28);
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.5rem);
        line-height: 1.05;
      }

      .subtitle {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(37, 99, 235, 0.18);
        border-radius: 999px;
        color: #1e3a8a;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
        font-weight: 700;
        white-space: nowrap;
      }

      .panel {
        overflow: hidden;
        border: 1px solid rgba(217, 226, 239, 0.86);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(248, 250, 252, 0.9);
      }

      .panel-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 800;
      }

      .contest-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 14px;
        padding: 20px;
      }

      .contest-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-height: 86px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        background: linear-gradient(180deg, #fff, var(--surface-soft));
        text-decoration: none;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.05);
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .contest-card:hover {
        transform: translateY(-2px);
        border-color: rgba(37, 99, 235, 0.45);
        box-shadow: 0 16px 34px rgba(37, 99, 235, 0.14);
      }

      .contest-name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: 1.05rem;
        font-weight: 800;
      }

      .arrow {
        display: grid;
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 999px;
        color: #fff;
        background: var(--primary);
        font-weight: 800;
      }

      .empty {
        padding: 42px 24px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 700px) {
        .shell { width: min(100% - 22px, 1040px); padding: 24px 0; }
        .topbar { align-items: flex-start; flex-direction: column; }
        .panel-head { align-items: flex-start; flex-direction: column; }
        .contest-grid { grid-template-columns: 1fr; padding: 14px; }
      }
    </style>
  </head>

  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">CAB</div>
          <div>
            <h1>Contest Audio Browser</h1>
            <p class="subtitle">Select a contest to browse QSOs and playback recordings.</p>
          </div>
        </div>
        <div class="badge">{{ contests|length }} contests</div>
      </header>

      <section class="panel" aria-labelledby="contest-list-title">
        <div class="panel-head">
          <h2 class="panel-title" id="contest-list-title">Available Contests</h2>
          <span class="subtitle">Detected under CONTESTS_ROOT</span>
        </div>

        {% if contests %}
          <div class="contest-grid">
            {% for cid in contests %}
            <a class="contest-card" href="/contest/{{ cid }}">
              <span class="contest-name">{{ cid }}</span>
              <span class="arrow" aria-hidden="true">></span>
            </a>
            {% endfor %}
          </div>
        {% else %}
          <div class="empty">No contests found under CONTESTS_ROOT.</div>
        {% endif %}
      </section>
    </main>
  </body>
</html>
